      <h1>ChemAssure Global – Industrial Foam Control Solutions</h1>
      <p>Application-specific defoamers and antifoams engineered for textiles, wastewater, paints, paper, construction, fermentation and sensitive water systems. We provide foam control solutions designed for process efficiency and sustainability across 10+ industries in India.</p>
      <h2>Our Approach</h2>
      <p>We don't sell generic defoamers. Every solution is configured based on your specific process conditions — foam mechanism, temperature, pH, shear level, and chemistry compatibility. We select from silicone, silicone-free, polyether, fatty ester, and hybrid chemistry platforms to match your operating window.</p>
      <h2>Industries We Serve</h2>
      <p>Textiles, wastewater treatment, paints and coatings, paper and pulp, construction chemicals, fermentation, food processing, agrochemicals, adhesives, and water treatment systems.</p>
      <h2>Why Choose ChemAssure Global</h2>
      <ul>
        <li>Application-driven solutions configured for your specific process</li>
        <li>5 chemistry platforms with 22+ product grades</li>
        <li>Dosage optimization that typically reduces chemical costs by 30-50%</li>
        <li>Biodegradable options and water-reuse compatible grades</li>
        <li>Serving 10+ industries across India with global-standard engineering</li>
      </ul>
      <h2>Explore Our Solutions</h2>

      <p>Headquartered in Surat, Gujarat, India. <a href="/contact">Get in touch</a> to discuss your foam control requirements.</p>

    <!-- WebMCP: expose site tools to AI agents via the browser -->
    <script>
      if (navigator.modelContext && navigator.modelContext.provideContext) {
        navigator.modelContext.provideContext({
          tools: [
            {
              name: "search_labs",
              description: "Search NABL-accredited testing laboratories across India by location, discipline, or keyword.",
              inputSchema: {
                type: "object",
                properties: {
                  query: { type: "string", description: "Free-text search" },
                  state: { type: "string", description: "Indian state filter" },
                  city: { type: "string", description: "City filter" },
                  disciplines: { type: "string", description: "Testing discipline filter" },
                  page: { type: "integer", default: 1 },
                  limit: { type: "integer", default: 20 }
                }
              },
              execute: async function(params) {
                var qs = new URLSearchParams(params).toString();
                var res = await fetch("/api/labs-search?" + qs);
                return res.json();
              }
            },
            {
              name: "submit_contact",
              description: "Submit a contact inquiry to ChemAssure Global.",
              inputSchema: {
                type: "object",
                required: ["name", "email", "message"],
                properties: {
                  name: { type: "string" },
                  email: { type: "string", format: "email" },
                  company: { type: "string" },
                  phone: { type: "string" },
                  message: { type: "string" }
                }
              },
              execute: async function(params) {
                var res = await fetch("/api/contact", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(params)
                });
                return res.json();
              }
            },
            {
              name: "request_sample_report",
              description: "Request a sample QC report delivered via email.",
              inputSchema: {
                type: "object",
                required: ["name", "email"],
                properties: {
                  name: { type: "string" },
                  email: { type: "string", format: "email" },
                  company: { type: "string" },
                  phone: { type: "string" }
                }
              },
              execute: async function(params) {
                var res = await fetch("/api/download-report", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify(params)
                });
                return res.json();
              }
            }
          ]
        });
      }
    </script>
